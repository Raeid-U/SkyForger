name: Publish auction snapshot

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

concurrency:
  group: auction-snapshot-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare data branch and reserve collection window
        id: reserve
        shell: bash
        run: |
          set -euo pipefail
          # Isolated worktree keeps generated data out of application history.
          if git ls-remote --exit-code --heads origin auction-data > /dev/null; then
            git fetch origin auction-data
            git worktree add "$RUNNER_TEMP/auction-data" -B auction-data FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/auction-data"
            git -C "$RUNNER_TEMP/auction-data" checkout --orphan auction-data
            git -C "$RUNNER_TEMP/auction-data" rm -rf .
          fi
          cd "$RUNNER_TEMP/auction-data"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          previous=0
          if test -f last-attempt.txt; then previous=$(cat last-attempt.txt); fi
          current=$(date +%s)
          if (( current - previous < 600 )); then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Persist before collecting so failed/manual runs cannot immediately rescan.
          echo "$current" > last-attempt.txt
          git add last-attempt.txt
          git commit -m 'chore: reserve auction collection window'
          git push origin HEAD:auction-data
      - name: Collect validated snapshot
        if: steps.reserve.outputs.skip != 'true'
        run: npm run --silent auctions:prices > "$RUNNER_TEMP/auction-prices.json"
      - name: Publish snapshot
        if: steps.reserve.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/auction-prices.json" "$RUNNER_TEMP/auction-data/auction-prices.json"
          cd "$RUNNER_TEMP/auction-data"
          git add auction-prices.json
          git commit -m 'chore: refresh auction snapshot'
          git push origin HEAD:auction-data
