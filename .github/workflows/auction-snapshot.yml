name: Publish auction snapshot

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

concurrency:
  group: auction-snapshot-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out application
        id: checkout
        uses: actions/checkout@v7.0.1
        timeout-minutes: 1
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v7.1.0
        timeout-minutes: 1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        id: install
        timeout-minutes: 2
        run: npm ci --no-audit --no-fund
      - name: Prepare data branch and reserve collection window
        id: reserve
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          # Isolated worktree keeps generated data out of application history.
          if git ls-remote --heads origin auction-data > "$RUNNER_TEMP/auction-data-ref.txt"; then
            branch_exists=$(cat "$RUNNER_TEMP/auction-data-ref.txt")
          else
            echo '::error::Could not inspect auction-data. Check repository access.'
            exit 1
          fi
          if test -n "$branch_exists"; then
            git fetch origin auction-data
            git worktree add "$RUNNER_TEMP/auction-data" -B auction-data FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/auction-data"
            git -C "$RUNNER_TEMP/auction-data" checkout --orphan auction-data
            git -C "$RUNNER_TEMP/auction-data" rm -rf .
          fi
          cd "$RUNNER_TEMP/auction-data"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          previous=0
          if test -f last-attempt.txt; then previous=$(cat last-attempt.txt); fi
          if ! [[ "$previous" =~ ^[0-9]{1,11}$ ]]; then
            echo '::error::Invalid last-attempt.txt on auction-data.'
            exit 1
          fi
          current=$(date +%s)
          if (( current - previous < 600 )); then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Skipped: a collection window was reserved less than ten minutes ago.'
            exit 0
          fi
          # Persist before collecting so failed/manual runs cannot immediately rescan.
          echo "$current" > last-attempt.txt
          git add last-attempt.txt
          git commit -m 'chore: reserve auction collection window'
          git push origin HEAD:auction-data
      - name: Collect validated snapshot
        id: collect
        continue-on-error: true
        if: steps.reserve.outputs.skip != 'true'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting bounded auction collection at $(date -u +%FT%TZ)"
          if npm run --silent auctions:prices > "$RUNNER_TEMP/auction-prices.json" 2> >(tee "$RUNNER_TEMP/auction-collector.log" >&2); then
            echo '::notice::Complete auction snapshot validated.'
          else
            collector_exit=$?
            echo "::warning::Auction collection failed (exit $collector_exit). Recording consecutive failure; previous snapshot was not replaced."
            exit "$collector_exit"
          fi
      - name: Publish snapshot or record collection failure
        id: publish
        timeout-minutes: 1
        if: steps.reserve.outputs.skip != 'true'
        env:
          COLLECT_RESULT: ${{ steps.collect.outcome }}
        shell: bash
        run: bash scripts/publish-auction-snapshot.sh "$RUNNER_TEMP/auction-data" "$RUNNER_TEMP/auction-prices.json" "$COLLECT_RESULT"
      - name: Run summary
        if: always()
        timeout-minutes: 1
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          NODE_RESULT: ${{ steps.node.outcome }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          RESERVE_RESULT: ${{ steps.reserve.outcome }}
          COLLECT_RESULT: ${{ steps.collect.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          FAILURE_COUNT: ${{ steps.publish.outputs.failure_count }}
          COOLDOWN_SKIP: ${{ steps.reserve.outputs.skip }}
        shell: bash
        run: |
          {
            echo '## Auction snapshot run'
            echo
            echo "Trigger: $GITHUB_EVENT_NAME"
            echo
            echo '| Stage | Outcome |'
            echo '| --- | --- |'
            echo "| Checkout | $CHECKOUT_RESULT |"
            echo "| Node setup (no Actions cache) | $NODE_RESULT |"
            echo "| Dependency installation | $INSTALL_RESULT |"
            echo "| Collection reservation | $RESERVE_RESULT |"
            echo "| Hypixel collection | $COLLECT_RESULT |"
            echo "| Snapshot publication | $PUBLISH_RESULT |"
            echo
            if test "$COOLDOWN_SKIP" = true; then
              echo 'Collection skipped because the previous reservation is less than ten minutes old.'
            elif test "$COLLECT_RESULT" != success && test -n "$FAILURE_COUNT"; then
              echo "Consecutive collection failures: $FAILURE_COUNT. Previous snapshot retained with its original timestamp."
              echo 'The action fails at three consecutive collection failures and on each further failure until recovery.'
            elif test "$PUBLISH_RESULT" = success; then
              echo "Snapshot: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/auction-data/auction-prices.json"
            else
              echo 'No new snapshot was published. Any previous snapshot remains intact. Inspect the first failed or cancelled stage above.'
            fi
            if test -f "$RUNNER_TEMP/auction-collector.log"; then
              echo
              echo '### Collector log (last 30 lines)'
              echo '```text'
              tail -n 30 "$RUNNER_TEMP/auction-collector.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
